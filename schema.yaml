schemaVersion: "1.1.0"
locale: en
variableGroups:
  - title: Destination
    variables:
      - region
      - compartment_ocid
      - name_prefix
  - title: Function network choice
    variables:
      - network_choice
  - title: Select an existing function network
    visible: ${network_choice}
    variables:
      - existing_vcn_ocid
      - existing_subnet_ocid
  - title: Define a new function network
    visible:
      not:
        - ${network_choice}
    variables:
      - vcn_cidr
      - subnet_cidr
  - title: Developer script bucket choice
    variables:
      - bucket_choice
      - par_expiration_days
  - title: Select an existing developer script bucket
    visible: ${bucket_choice}
    variables:
      - existing_bucket_name
  - title: Define a new developer script bucket
    visible:
      not:
        - ${bucket_choice}
    variables:
      - bucket_name
  - title: Function and developer settings
    variables:
      - function_name
      - function_memory_mb
      - enable_function_deployment
variables:
  tenancy_ocid:
    type: string
    required: true
    visible: false
    title: Tenancy OCID
  region:
    type: oci:identity:region:name
    required: true
    title: Region
  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Target compartment
  name_prefix:
    type: string
    required: true
    title: Name prefix
    description: Use 3 to 21 lowercase letters, numbers, or hyphens; start with a letter.
  network_choice:
    type: boolean
    required: true
    title: Select an existing function network
    description: Check to select an existing VCN and private regional subnet. Leave unchecked to define a new network.
    default: false
  existing_vcn_ocid:
    type: oci:core:vcn:id
    title: Existing VCN
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible: ${network_choice}
  existing_subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private regional subnet
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${existing_vcn_ocid}
      hidePublicSubnet: true
      hideAdSubnet: true
    visible: ${network_choice}
  vcn_cidr:
    type: string
    title: New VCN CIDR
    default: 10.42.0.0/16
    visible:
      not:
        - ${network_choice}
  subnet_cidr:
    type: string
    title: New private subnet CIDR
    default: 10.42.1.0/24
    visible:
      not:
        - ${network_choice}
  bucket_choice:
    type: boolean
    required: true
    title: Select an existing developer script bucket
    description: Check to enter an existing bucket name. Leave unchecked to define a new bucket.
    default: false
  existing_bucket_name:
    type: string
    title: Existing bucket name
    description: In OCI Console, open Storage, Buckets in the target compartment and copy the bucket name.
    visible: ${bucket_choice}
  bucket_name:
    type: string
    title: New bucket name
    description: Leave blank to use a name based on the stack prefix.
    visible:
      not:
        - ${bucket_choice}
  par_expiration_days:
    type: integer
    required: true
    title: Script link lifetime (days)
    description: Number of days the developer setup ZIP download link remains valid after apply.
    default: 30
    minimum: 1
  function_name:
    type: string
    default: function
    title: Function name
  function_memory_mb:
    type: integer
    default: 256
    title: Function memory (MB)
  enable_function_deployment:
    type: boolean
    default: false
    title: Enable Function and deployment stage after first image build
