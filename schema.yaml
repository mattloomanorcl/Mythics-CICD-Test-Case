locale: en
variableGroups:
  - title: Destination
    variables:
      - tenancy_ocid
      - region
      - compartment_ocid
      - name_prefix
  - title: Function network
    variables:
      - network_choice
      - existing_vcn_ocid
      - existing_subnet_ocid
      - vcn_cidr
      - subnet_cidr
  - title: Developer script bucket
    variables:
      - bucket_choice
      - existing_bucket_name
      - bucket_name
      - par_expiration
  - title: Function and developer settings
    variables:
      - function_name
      - function_memory_mb
      - enable_function_deployment
      - tenancy_name
      - region_key
      - developer_identity_domain
      - developer_user_name
      - developer_oci_profile
variables:
  tenancy_ocid:
    type: string
    required: true
    title: Tenancy OCID
    description: Find this in the OCI Console under Profile, Tenancy, Tenancy Information.
  region:
    type: oci:identity:region:name
    required: true
    title: Region
  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: Target compartment
  name_prefix:
    type: string
    required: true
    title: Name prefix
    description: Use 3 to 21 lowercase letters, numbers, or hyphens; start with a letter.
  network_choice:
    type: enum
    required: true
    title: Function network
    enum: [Select, Define]
    default: Define
  existing_vcn_ocid:
    type: oci:core:vcn:id
    title: Existing VCN
    dependsOn:
      compartmentId: ${compartment_ocid}
    visible:
      eq:
        - ${network_choice}
        - Select
  existing_subnet_ocid:
    type: oci:core:subnet:id
    title: Existing private regional subnet
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${existing_vcn_ocid}
      hidePublicSubnet: true
      hideAdSubnet: true
    visible:
      eq:
        - ${network_choice}
        - Select
  vcn_cidr:
    type: string
    title: New VCN CIDR
    default: 10.42.0.0/16
    visible:
      eq:
        - ${network_choice}
        - Define
  subnet_cidr:
    type: string
    title: New private subnet CIDR
    default: 10.42.1.0/24
    visible:
      eq:
        - ${network_choice}
        - Define
  bucket_choice:
    type: enum
    required: true
    title: Developer script bucket
    enum: [Select, Define]
    default: Define
  existing_bucket_name:
    type: string
    title: Existing bucket name
    description: In OCI Console, open Storage, Buckets in the target compartment and copy the bucket name. Resource Manager has no native bucket-name selector.
    visible:
      eq:
        - ${bucket_choice}
        - Select
  bucket_name:
    type: string
    title: New bucket name
    description: Leave blank to use a name based on the stack prefix.
    visible:
      eq:
        - ${bucket_choice}
        - Define
  par_expiration:
    type: string
    required: true
    title: Script link expiry
    description: Enter a future UTC RFC3339 timestamp, for example 2027-12-31T23:59:59Z.
  function_name:
    type: string
    default: function
    title: Function name
  function_memory_mb:
    type: integer
    default: 256
    title: Function memory (MB)
  enable_function_deployment:
    type: boolean
    default: false
    title: Enable Function and deployment stage after first image build
  tenancy_name:
    type: string
    required: true
    title: Tenancy name
  region_key:
    type: string
    required: true
    title: Region key
    description: Copy the short region key from OCI Regions documentation or your Console region details.
  developer_identity_domain:
    type: string
    required: true
    title: Developer identity domain name
  developer_user_name:
    type: string
    required: true
    title: Developer user name
  developer_oci_profile:
    type: string
    default: DEFAULT
    title: Developer OCI CLI profile
